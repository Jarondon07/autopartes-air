# Copiar a /etc/nginx/sites-available/autopartes-air y enlazar en sites-enabled.
# Sustituir SERVER_NAME por la IP del VPS (y luego por el dominio).
#
# Un solo origen para todo: la web usa baseURL relativa `/api/v1` y `/uploads`,
# así no hace falta CORS entre dominios ni variables VITE_*.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # multer limita cada imagen a 3 MB; se deja algo de holgura para el multipart.
    client_max_body_size 5M;

    root /srv/autopartes-air/apps/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA de React Router: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea: si no, los usuarios quedan con un bundle viejo.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Assets con hash en el nombre → cache larga.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Imágenes subidas: las sirve Nginx directo (más rápido que pasar por Node).
    # La barra final del alias es obligatoria.
    location /uploads/ {
        alias /srv/autopartes-air/apps/server/uploads/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
